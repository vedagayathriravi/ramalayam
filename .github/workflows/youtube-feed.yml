name: Update YouTube feed

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-youtube-feed.py'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch YouTube RSS and write JSON
        run: python3 scripts/update-youtube-feed.py

      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-feed.json
          if git diff --staged --quiet; then
            echo "No feed changes."
          else
            git commit -m "Update YouTube feed"
            git push
          fi
